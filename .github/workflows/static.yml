name: Análise Estática

on:
  push:
  pull_request:

jobs:
  pylint-deprecation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-python/picture_show

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar código depreciado
        run: |
          python -m pylint \
            --disable=all \
            --enable=deprecated-module,deprecated-method,deprecated-argument,deprecated-class,deprecated-decorator,deprecated-attribute \
            api picture_show

      - name: Verificar código duplicado
        run: |
          python -m pylint \
            --disable=all \
            --enable=duplicate-code \
            --min-similarity-lines=4 \
            --ignore-paths=".*[\\/]migrations[\\/].*" \
            api picture_show

      - name: Verificar código com Ruff
        run: |
          python -m ruff check .

      - name: Instalar Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Gerar diagrama UML
        run: |
          mkdir -p diagrams
          pyreverse -o png -p picture_show --output-directory diagrams api.models

      - name: Disponibilizar diagramas
        uses: actions/upload-artifact@v7
        with:
          name: diagramas-uml
          path: |
            backend-python/picture_show/diagrams/