name: Análise Estática - Depreciações

on:
  push:
  pull_request:

jobs:
  pylint-deprecation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-python/picture_show

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar código depreciado
        run: |
          python -m pylint \
            --disable=all \
            --enable=deprecated-module,deprecated-method,deprecated-argument,deprecated-class,deprecated-decorator,deprecated-attribute \
            api picture_show